[project]
name = "pulseboard"
version = "0.1.0"
description = "Local-first analytics with an on-prem investigator agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pulseboard-server"]

[tool.uv]
package = false

[tool.uv.sources]
pulseboard-server = { workspace = true }

[tool.uv.workspace]
members = ["apps/pulseboard-server"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["apps/pulseboard-server/tests"]

[tool.ruff]
target-version = "py313"
src = ["apps"]

[tool.ruff.lint.isort]
known-first-party = ["pulseboard_server"]
